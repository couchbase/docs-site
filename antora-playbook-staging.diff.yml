antora:
  extensions:
  - ./lib/site-navigation-data-json.js
  - ./lib/report-tree.js
  - ./lib/site-stats-extension.js
  - ./lib/component-stats.js
  - ./lib/time-content-aggregation.js
  - ./lib/site-dependencies.js

site:
  title: Couchbase Docs Staging
  url: https://docs-staging.couchbase.com
  start_page: home::index.adoc
  robots: |
    User-agent: *
    Disallow: /

    User-agent: Algolia Crawler
    Allow: /
  keys:
    google_analytics: ~
    nav_groups: |
        [
          { "title": "Server",
            "startPage": "home::server.adoc",
            "components": ["server", "operator", "enterprise-analytics", "cloud-native-gateway"],
            "color": "#c41016" },
          { "title": "Mobile / Edge",
            "startPage": "home::mobile.adoc",
            "components": ["couchbase-lite", "couchbase-lite-javascript", "sync-gateway", "couchbase-edge-server"],
            "color": "#d9480f" },
          { "title": "Capella",
            "startPage": "home::cloud.adoc",
            "components": ["cloud", "app-services", "analytics"],
            "expandHeaderLevels": 1,
            "color": "#e8830c" },
          { "title": "AI Data Plane",
            "startPage": "ai:get-started:intro.adoc",
            "components": ["ai", "mcp-server"],
            "color": "#f2a541" },
          { "title": "Develop",
            "startPage": "home::developer.adoc",
            "color": "#8c1c1c",
              "subGroups": [
                {
                  "title": "Operational SDKs",
                  "startPage": "home::sdk.adoc",
                  "components": ["dotnet-sdk", "efcore-provider", "c-sdk", "cxx-sdk", "go-sdk", "java-sdk", "quarkus-extension", "kotlin-sdk", "nodejs-sdk", "php-sdk", "python-sdk", "ruby-sdk", "rust-sdk", "scala-sdk", "elasticsearch-connector", "kafka-connector", "spark-connector", "tableau-connector", "power-bi-connector", "superset-connector", "sdk-extensions"],
                  "expandHeaderLevels": 1
                },
                {
                  "title": "Analytics SDKs",
                  "startPage": "home::analytics-sdk.adoc",
                  "components": ["*-analytics-sdk", "*-columnar-sdk"],
                  "expandHeaderLevels": 1
                }
              ]
            },
          { "title": "Contribute",
            "components": ["home", "styleguide", "ui-ux", "pendo"],
            "color": "#6b7280" }
        ]

content:

  $select:
    - '.'
    - '**' # everything
    # see https://github.com/micromatch/picomatch for full details
    # e.g.
    # - '**/*sdk*' # add all repos matching *sdk*

  # start off with first 3 branches
  $prune: 3

  sources:
  - url: https://github.com/couchbaselabs/cb-swagger
    branches: [capella] # ensure added as well as most recent release/* branches

  - url: https://github.com/couchbaselabs/docs-devex
    branches: [capella] # ensure added as well as most recent release/* branches

  - url: https://github.com/couchbaselabs/cbmultimanager
    branches:
      $replace: [master]

  - url: https://github.com/couchbase/docs-sdk-common
    # not $replace, as we can just merge
    branches: 
       - release/8.0
       - release/7.7
       - release/7.6.6
       - release/7.6.2
       - release/7.6
       - release/7.2

  - url: https://github.com/couchbase/docs-sdk-cxx
    branches: 
       - release/1.2

  - url: https://github.com/couchbase/docs-sdk-dotnet
    branches: 
       - temp/3.9
       
  - url: https://github.com/couchbase/docs-sdk-nodejs
    branches: 
       - temp/4.6

  - url: https://github.com/couchbase/docs-sdk-php
    branches: 
       - temp/4.4

  - url: https://github.com/couchbase/docs-sdk-ruby
    branches: 
       - temp/3.7

  - url: https://github.com/couchbase/docs-sdk-kotlin
    branches: 
      # 'release/3.9' instead of 'temp/3.9'
      $replace: [release/3.9, temp/1.5, temp/1.4, temp/1.3, release/1.2]

ui:
  bundle:
    url: https://github.com/couchbase/docs-ui/releases/download/DOC-14537-new-docsearch-ui-3/ui-bundle.zip

asciidoc:
  attributes:
    # page-chatbot-origin: https://dfddckwnvn0ml.cloudfront.net # Production, via Elliot
    # page-chatbot-origin: https://d2tkqbbgxczr0v.cloudfront.net # Staging, via Elliot
    page-chatbot-origin: https://d2sozpdiqok6m4.cloudfront.net # Prod Ask AI
