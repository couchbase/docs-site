# RUN:
#  scripts/patch-cutdown-playbook antora-playbook.preview5

antora:
  extensions:
  - ./lib/report-tree.js

site:
  title: Couchbase Docs - Fusion Preview
  robots: disallow

content:
  $prune: 1

  sources:
   - url: https://github.com/couchbase/docs-capella
     branches:
       $replace: AV-103367-management-api-fusion

   - url: https://github.com/couchbaselabs/docs-devex
     branches: capella

asciidoc:
  attributes:

    # metadata for Hakim's benefit
    docs-contact: Rebecca / Sarah

    page-show-preview-banner: true
    page-hide-preview-link: true
    page-watermark: Fusion 

ui:
  bundle:
    url: https://github.com/couchbase/docs-ui/releases/download/prod-238/ui-bundle.zip
