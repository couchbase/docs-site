# RUN:
#  scripts/patch-cutdown-playbook antora-playbook.preview5

antora:
  extensions:
  - ./lib/report-tree.js

site:
  title: Couchbase Docs - Totoro Preview
  robots: disallow

content:
  $prune: 1
  $select:
    - '.'
    - '**/docs-columnar'
    - '**/docs-enterprise-analytics'
    - '**/docs-analytics'
    - '**/docs-capella'
    - '**/docs-server'
    - '**/docs-devex'
    - '**/cb-swagger'
    - '**/docs-connectors-power-bi'
    - '**/docs-tableau'
    - '**/docs-sdk-java'
    - '**/docs-sdk-common'
    - '**/couchbase-cli'
    - '**/backup'

  sources:
   - url: https://github.com/couchbase/docs-server
     branches: merge-prs/release/8.5

   #- url: https://github.com/couchbaselabs/docs-fleetmanager
   #branches: main
    
   - url: https://github.com/couchbaselabs/docs-devex
     branches:
       - release/8.5
       - capella

   - url: https://github.com/couchbaselabs/cb-swagger
     branches: release/8.5

   - url: https://github.com/couchbase/docs-analytics
     branches: release/8.5

    # have pinged Safian Ali, who will update master to 8.5 shortly
    #- url: https://github.com/couchbase/couchbase-cli
    #  branches: master
    #
    #- url: https://github.com/couchbase/backup
    #  branches: master

asciidoc:
  attributes:

    # metadata for Hakim's benefit
    docs-contact: Supritha

    page-show-preview-banner: true
    page-watermark: Totoro Preview
