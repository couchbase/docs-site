######
# WARNING: DO NOT EDIT BY HAND
# (it will get overwritten)
#
# Instead
#
#  * edit antora-playbook.preview5.diff.yml with just the *differences* from the main playbook
#  * run: /Users/hakimcassimally/couchbase/docs-site/scripts/patch-cutdown-playbook antora-playbook.preview5 

git:
  ensure_git_suffix: false
  fetch_concurrency: 1
urls:
  latest_version_segment_strategy: redirect:to
  latest_version_segment: current
output:
  dir: ./public
runtime:
  fetch: true
antora:
  extensions:
    - "@antora/site-generator-ms"
    - ./lib/site-navigation-data-json.js
    - ./lib/embargo.js
    - ./lib/antora-component-version-rank.js
    - ./lib/llms-txt.js
    - ./lib/report-tree.js
site:
  url: https://docs.couchbase.com
  start_page: home::index.adoc
  keys:
    google_analytics: GTM-MVPNN2
    nav_groups: >
      [
        { "title": "Server",
          "startPage": "home::server.adoc",
          "components": ["server", "operator", "enterprise-analytics", "cloud-native-gateway"],
          "color": "#c41016"
        },
        { "title": "Mobile / Edge",
          "startPage": "home::mobile.adoc",
          "components": ["couchbase-lite", "couchbase-lite-javascript", "cbl-reactnative", "sync-gateway", "couchbase-edge-server"],
          "color": "#d9480f"
        },
        { "title": "Capella",
          "startPage": "home::cloud.adoc",
          "components": ["cloud", "app-services", "analytics"],
          "expandHeaderLevels": 1,
          "color": "#e8830c"
        },
        { "title": "AI Data Plane",
          "startPage": "ai:get-started:intro.adoc", 
          "components": ["ai", "mcp-server"],
          "color": "#f2a541"
        },
        { "title": "Develop",
          "startPage": "home::developer.adoc",
          "color": "#8c1c1c",
          "subGroups": [
            {
              "title": "Operational SDKs",
              "startPage": "home::sdk.adoc",
              "components": ["dotnet-sdk", "efcore-provider", "c-sdk", "cxx-sdk", "go-sdk", "java-sdk", "quarkus-extension", "kotlin-sdk", "nodejs-sdk", "php-sdk", "python-sdk", "ruby-sdk", "rust-sdk", "scala-sdk", "elasticsearch-connector", "kafka-connector", "spark-connector", "tableau-connector", "talend-connector", "power-bi-connector", "superset-connector", "sdk-extensions"],
              "expandHeaderLevels": 1
            },
            {
              "title": "Analytics SDKs",
              "startPage": "home::analytics-sdk.adoc",
              "components": ["*-analytics-sdk", "*-columnar-sdk"],
              "expandHeaderLevels": 1
            }
          ]
        },
        { "title": "Contribute",
          "components": ["home", "styleguide", "ui-ux", "pendo"],
          "color": "#f2a541"
        }
      ]
  title: Couchbase Docs - Server 8.5 Preview
  robots: disallow
asciidoc:
  extensions:
    - ./lib/source-url-include-processor.js
    - ./lib/json-config-ui-block-macro.js
    - ./lib/inline-man-macro.js
    - ./lib/multirow-table-head-tree-processor.js
    - ./lib/swagger-ui-block-macro.js
    - ./lib/description-block.js
    - ./lib/markdown-block.js
    - ./lib/template-block.js
    - asciidoctor-kroki
    - asciidoctor-external-callout
    - "@asciidoctor/tabs"
  attributes:
    site-navigation-data-path: _/js/site-navigation-data.js
    max-include-depth: 10
    page-partial: false
    experimental: ""
    idprefix: "@"
    idseparator: -@
    tabs: tabs
    tabs-sync-option: ""
    toc: null
    page-chatbot-origin: https://d2tkqbbgxczr0v.cloudfront.net
    page-toclevels: 1@
    page-rank: 50@
    xrefstyle: short
    ai: AI Data Plane
    ai-long: Couchbase AI Data Plane
    enterprise: https://www.couchbase.com/products/editions[ENTERPRISE EDITION]
    community: https://www.couchbase.com/products/editions[COMMUNITY EDITION]
    sqlpp: SQL++
    sqlppc: SQL++ for Capella Analytics
    sqlppea: SQL++ for Enterprise Analytics
    sqlpp_url: https://www.couchbase.com/products/n1ql
    cbpp: Couchbase++
    kroki-server-url: null
    kroki-fetch-diagram: true
    docs-contact: Supritha
    page-show-preview-banner: true
    page-hide-preview-link: true
    page-watermark: Release 8.5 Preview
ui:
  bundle:
    url: https://github.com/couchbase/docs-ui/releases/download/prod-238/ui-bundle.zip
content:
  branches: master
  sources:
    - url: .
      start_path: home
      branches: HEAD
    - url: https://github.com/couchbase/docs-server
      branches: merge-prs/release/8.5
    - url: https://github.com/couchbaselabs/docs-devex
      branches:
        - merge-prs/release/8.5
    - url: https://github.com/couchbaselabs/cb-swagger
      branches: release/8.5
      start_path: docs
    - url: https://github.com/couchbase/docs-analytics
      branches: release/8.5
    - url: https://github.com/couchbase/couchbase-cli
      branches: master
      start_path: docs
    - url: https://github.com/couchbase/backup
      branches: master
      start_path: docs
