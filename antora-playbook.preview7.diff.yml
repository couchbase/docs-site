# RUN:
#  scripts/patch-cutdown-playbook antora-playbook.preview7

antora:
  extensions:
  - ./lib/report-tree.js

site:
  title: "Couchbase Docs - Capella Alerts Preview"
  robots: disallow

content:
  $prune: 1

  sources:
   - url: https://github.com/couchbase/docs-capella
     branches:
       $replace: AV-136175_improve-alert-experience

asciidoc:
  attributes:

    # metadata for Hakim's benefit
    docs-contact: Zeba / Rebecca

    page-show-preview-banner: true
    page-hide-preview-link: true
    page-watermark: "Capella Alerts Preview"
