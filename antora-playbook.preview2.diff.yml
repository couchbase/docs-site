# RUN:
#  scripts/patch-cutdown-playbook antora-playbook.preview2

antora:
  extensions:
  - ./lib/report-tree.js

site:
  title: Couchbase Docs Preview Polaris
  robots: disallow
  keys:
    nav_groups: |
        [
          { "title": "Start Here", "startPage": "home::start-here.adoc"},
          { "title": "Server", "startPage": "home::operational.adoc",
            "color": "#c41016",
            "subGroups": [
              {
                "title": "Self-Managed Server",
                "startPage": "home::server.adoc",
                "components": ["server"],
                "expandHeaderLevels": 1
              },
              {
                "title": "Kubernetes Operator",
                "startPage": "operator::overview.adoc",
                "components": ["operator"],
                "expandHeaderLevels": 1
              },
              {
                "title": "Cloud Native Gateway",
                "startPage": "cloud-native-gateway:intro:about-cng.adoc",
                "components": ["cloud-native-gateway"],
                "expandHeaderLevels": 1
              },
              {
                "title": "Operational SDKs",
                "startPage": "home::sdk.adoc",
                "components": ["dotnet-sdk", "efcore-provider", "c-sdk", "cxx-sdk", "go-sdk", "java-sdk", "quarkus-extension", "kotlin-sdk", "nodejs-sdk", "php-sdk", "python-sdk", "ruby-sdk", "rust-sdk", "scala-sdk", "elasticsearch-connector", "kafka-connector", "spark-connector", "tableau-connector", "talend-connector"],
                "expandHeaderLevels": 1
              }
            ]
          },
          { "title": "Capella",
            "startPage": "home::cloud.adoc",
            "components": ["cloud"],
            "color": "#e8830c",
            "subGroups": [
              {
                "title": "Capella Operational",
                "startPage": "home::cloud.adoc",
                "components": ["cloud"],
                "expandHeaderLevels": 1
              },
              {
                "title": "Operational SDKs",
                "startPage": "home::sdk.adoc",
                "components": ["dotnet-sdk", "efcore-provider", "c-sdk", "cxx-sdk", "go-sdk", "java-sdk", "quarkus-extension", "kotlin-sdk", "nodejs-sdk", "php-sdk", "python-sdk", "ruby-sdk", "rust-sdk", "scala-sdk", "sdk-extensions", "elasticsearch-connector", "kafka-connector", "spark-connector", "tableau-connector", "talend-connector"],
                "expandHeaderLevels": 1
              }
            ]
          },
          { "title": "Mobile / Edge", "startPage": "home::mobile.adoc",
              "subGroups": [
                {
                  "title": "Couchbase Lite",
                  "startPage": "couchbase-lite::index.adoc",
                  "components": ["couchbase-lite", "couchbase-lite-javascript", "couchbase-edge-server"],
                "expandHeaderLevels": 1
                },
                {
                  "title": "Sync Gateway",
                  "startPage": "sync-gateway::introduction.adoc",
                  "components": ["sync-gateway"],
                  "expandHeaderLevels": 1
                },
                {
                  "title": "App Services",
                  "startPage": "app-services:get-started:configuring-app-services.adoc",
                  "components": ["app-services"],
                  "expandHeaderLevels": 1
                }
              ]
          },
          { "title": "Operational Insights",
            "startPage": "home::operational-insights.adoc",
            "components": ["enterprise-analytics", "analytics", "*-insights-sdk-*"],
            "color": "#ed9426",
            "subGroups": [
              {
                "title": "Operational Insights Enterprise",
                "startPage": "enterprise-analytics:intro:intro.adoc",
                "components": ["enterprise-analytics"],
                "expandHeaderLevels": 1
              },
              {
                "title": "Operational Insights Capella",
                "startPage": "analytics:intro:intro.adoc",
                "components": ["analytics"],
                "expandHeaderLevels": 1
              },
              {
                "title": "Operational Insights SDKs",
                "startPage": "home::operational-insights-sdk.adoc",
                "components": ["*-insights-sdk"],
                "expandHeaderLevels": 1
              },
              {
                "title": "Analytics SDKs",
                "startPage": "home::analytics-sdk.adoc",
                "components": ["*-analytics-sdk", "*-columnar-sdk"],
                "expandHeaderLevels": 1
              },
              {
                "title": "Operational Insights Connectors",
                "startPage": "home::analytics-connectors.adoc",
                "components": ["tableau-connector", "power-bi-connector", "superset-connector"],
                "expandHeaderLevels": 1
              }
            ]
          },
          { "title": "AI Data Plane", "startPage": "ai:get-started:intro.adoc", "components": ["ai", "mcp-server"] },
          { "title": "Tutorials", "startPage": "tutorials::index.adoc", "components": ["tutorials"] },
          { "title": "Contribute",
            "components": ["home", "styleguide", "ui-ux", "pendo"],
            "color": "#f2a541"
          }
        ]

content:
  $prune: 1
  $select:
    - '.'
    - '**'

  sources:
   - url: https://github.com/couchbaselabs/docs-columnar
     branches:
       $replace: [ DOC-14645-Rename-CA-as-Operational-Insights-Capella ]
   - url: https://github.com/couchbaselabs/docs-enterprise-analytics
     branches:
       $replace: [ merge-prs/release/3.0, release/2.2, release/2.1, release/2.0 ]
   - url: https://github.com/couchbaselabs/docs-devex
     branches:
       - capella
   - url: https://github.com/couchbaselabs/docs-ai
     branches: DOC-14735_analytics-rename
   - url: https://github.com/couchbase/docs-capella
     branches: DOC-14735_preview-branch-october

   - url: https://github.com/couchbase/docs-columnar-sdk-common
     branches: 
       $replace: [DOC-14641--oi-renaming]
   - url: https://github.com/couchbase/docs-columnar-sdk-go
     branches: 
       $replace: [DOC-14641--oi-renaming]
   - url: https://github.com/couchbase/docs-columnar-sdk-java
     branches: 
       $replace: [DOC-14641--oi-renaming]
   - url: https://github.com/couchbase/docs-columnar-sdk-nodejs
     branches: 
       $replace: [DOC-14641--oi-renaming]
   - url: https://github.com/couchbase/docs-columnar-sdk-python
     branches: 
       $replace: [DOC-14641--oi-renaming]

asciidoc:
  attributes:
    docs-contact: Zeba
    page-show-preview-banner: true
    page-hide-preview-link: true
    page-watermark: Polaris
